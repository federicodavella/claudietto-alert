name: Claudietto

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avvisi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analizza e avvisa
        run: python claudietto.py
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FULL_REPORT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Salva lo stato
        run: |
          git config user.name "claudietto"
          git config user.email "claudietto@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Aggiorna stato"
          git push
